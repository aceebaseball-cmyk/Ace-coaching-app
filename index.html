<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ACE Baseball" />
    <meta name="application-name" content="ACE Baseball" />
    <meta name="format-detection" content="telephone=no" />
    <title>ACE Baseball | Coach Console</title>
    <link rel="icon" href="/ace-logo.png" />
    <link rel="apple-touch-icon" href="/ace-logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/ace-persistence.js"></script>
    <script src="/ace-fallbacks.js"></script>
    <style>
      :root {
        --ace-navy: #020617;
        --ace-black: #050505;
        --ace-card: #09090b;
        --ace-card-soft: rgba(9, 9, 11, 0.88);
        --ace-border: rgba(148, 163, 184, 0.16);
        --ace-border-strong: rgba(248, 250, 252, 0.18);
        --ace-red: #b91c1c;
        --ace-red-soft: rgba(185, 28, 28, 0.18);
        --ace-silver: #d4d4d8;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html {
        background: var(--ace-navy);
        scroll-behavior: smooth;
        overflow-x: hidden;
        width: 100%;
      }

      body {
        min-height: 100vh;
        width: 100%;
        overflow-x: hidden;
        margin: 0;
        overscroll-behavior-y: contain;
        -webkit-overflow-scrolling: touch;
        touch-action: manipulation;
        background:
          radial-gradient(circle at top left, rgba(185, 28, 28, 0.18), transparent 32rem),
          radial-gradient(circle at top right, rgba(148, 163, 184, 0.11), transparent 30rem),
          linear-gradient(135deg, #020617 0%, #050505 48%, #09090b 100%);
        color: white;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      #root {
        min-height: 100vh;
        width: 100%;
        overflow-x: hidden;
      }

      main,
      section,
      header,
      nav,
      div,
      article {
        min-width: 0;
      }

      h1,
      h2,
      h3,
      h4 {
        letter-spacing: -0.035em;
        overflow-wrap: break-word;
      }

      p,
      span,
      strong {
        overflow-wrap: break-word;
      }

      p {
        line-height: 1.65;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      input,
      select,
      textarea {
        min-height: 44px;
        max-width: 100%;
        transition: border-color 160ms ease, box-shadow 160ms ease, background-color 160ms ease;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: rgba(239, 68, 68, 0.75) !important;
        box-shadow: 0 0 0 3px rgba(185, 28, 28, 0.18);
      }

      button,
      a {
        transition: transform 160ms ease, border-color 160ms ease, background-color 160ms ease, opacity 160ms ease, box-shadow 160ms ease;
      }

      button {
        min-height: 44px;
        touch-action: manipulation;
      }

      button:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
      }

      button:active:not(:disabled) {
        transform: scale(0.99);
      }

      button:disabled {
        cursor: not-allowed;
      }

      img {
        max-width: 100%;
        height: auto;
      }

      .ace-brand-card {
        background: linear-gradient(145deg, rgba(9, 9, 11, 0.96), rgba(2, 6, 23, 0.94));
        border: 1px solid var(--ace-border);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.32);
      }

      .ace-logo-mark {
        width: 3.75rem;
        height: 3.75rem;
        border-radius: 1rem;
        background: rgba(2, 6, 23, 0.72);
        border: 1px solid rgba(212, 212, 216, 0.18);
        padding: 0.35rem;
        object-fit: contain;
        box-shadow: 0 18px 36px rgba(127, 29, 29, 0.22);
      }

      .ace-splash {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        background:
          radial-gradient(circle at center, rgba(185, 28, 28, 0.14), transparent 26rem),
          linear-gradient(135deg, #020617, #050505);
      }

      [class*="rounded-3xl"],
      [class*="rounded-[2rem]"] {
        border-color: var(--ace-border);
      }

      [class*="bg-zinc-950"] {
        background-color: rgba(9, 9, 11, 0.92);
      }

      [class*="border-zinc-800"] {
        border-color: var(--ace-border);
      }

      [class*="shadow-xl"],
      [class*="shadow-2xl"] {
        box-shadow: 0 20px 55px rgba(0, 0, 0, 0.28);
      }

      @media (max-width: 768px) {
        body {
          background:
            radial-gradient(circle at top, rgba(185, 28, 28, 0.13), transparent 24rem),
            linear-gradient(160deg, #020617 0%, #050505 52%, #09090b 100%);
        }

        h1 {
          font-size: clamp(2rem, 11vw, 3rem) !important;
          line-height: 0.95 !important;
        }

        h2 {
          font-size: clamp(1.35rem, 6vw, 1.8rem) !important;
        }

        .ace-brand-card {
          margin: 1rem;
          padding: 1.25rem !important;
          max-width: calc(100vw - 32px) !important;
        }

        .ace-logo-mark {
          width: 3.25rem;
          height: 3.25rem;
        }

        button,
        input,
        select,
        textarea {
          width: 100%;
          font-size: 16px;
        }

        nav button,
        .grid button {
          width: auto;
        }

        [class*="p-8"] {
          padding: 1.25rem !important;
        }

        [class*="p-6"] {
          padding: 1rem !important;
        }

        [class*="gap-6"] {
          gap: 1rem !important;
        }

        [class*="grid-cols-"],
        [style*="grid-template-columns"] {
          min-width: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="ace-splash">
        <div class="ace-brand-card" style="border-radius: 28px; padding: 28px; text-align: center; max-width: 360px; width:100%;">
          <img src="/ace-logo.png" alt="ACE Baseball" class="ace-logo-mark" style="margin: 0 auto 16px;" />
          <div style="font-size: 12px; letter-spacing: 0.28em; color: #fca5a5; font-weight: 900; text-transform: uppercase;">ACE Baseball</div>
          <div style="font-size: 24px; font-weight: 900; margin-top: 6px;">Loading Platform</div>
          <div style="color: #a1a1aa; margin-top: 8px; font-size: 14px;">Coach Console + Athlete App</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
